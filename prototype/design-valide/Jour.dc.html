<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choisir le jour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#15130F;text-decoration:none}a:hover{color:#15130F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #15130F; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; line-height: 1.4; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px">
    <a href="Main.dc.html" aria-label="Retour" style="width: 46px; height: 46px; border-radius: 50%; background: #F5F2EE; display: grid; place-items: center; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <div role="img" aria-label="Étape 1 sur 5" style="flex: 1; display: flex; gap: 5px">
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #F46A00"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #E7E2DC"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #E7E2DC"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #E7E2DC"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #E7E2DC"></span>
    </div>
    <button onClick="{{say}}" aria-label="Écouter cet écran" style="width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; background: #FFE7D1; color: #15130F; display: grid; place-items: center; cursor: pointer; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 10px 18px 0; min-height: 0">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.04; letter-spacing: -0.025em">Quel jour ?</h1>
    <span style="align-self: flex-start; background: #F5F2EE; border-radius: 8px; padding: 5px 10px; font-size: 13.5px; font-weight: 600">Au studio · Lomé</span>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px">
      <button disabled aria-label="Mois précédent" style="width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; background: #F5F2EE; color: #736D66; display: grid; place-items: center"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 20px">Décembre 2026</span>
      <button aria-label="Mois suivant" style="width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; background: #F5F2EE; color: #15130F; display: grid; place-items: center; cursor: pointer"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M9 18l6-6-6-6"></path></svg></button>
    </div>

    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; text-align: center; font-size: 12.5px; font-weight: 700; color: #665F58">
      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: -8px">
      <span></span>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
        <sc-if value="{{d.free}}" hint-placeholder-val="{{true}}">
          <a href="Heure.dc.html" aria-label="{{d.label}}" style="position: relative; aspect-ratio: 1; border-radius: 13px; background: #F5F2EE; display: grid; place-items: center; font-weight: 700; font-size: 16.5px; font-variant-numeric: tabular-nums">{{d.n}}<span style="position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #F46A00; display: {{d.dot}}"></span></a>
        </sc-if>
        <sc-if value="{{d.full}}" hint-placeholder-val="{{false}}">
          <span aria-label="{{d.label}}" style="aspect-ratio: 1; display: grid; place-items: center; font-weight: 700; font-size: 16.5px; font-variant-numeric: tabular-nums; color: #736D66; text-decoration: line-through">{{d.n}}</span>
        </sc-if>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: #665F58">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 5px; background: #F5F2EE; border: 1px solid #E7E2DC; box-sizing: border-box"></span>Libre</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 5px; background: #F5F2EE; display: grid; place-items: center"><span style="width: 6px; height: 6px; border-radius: 50%; background: #F46A00"></span></span>Presque plein</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-weight: 700; text-decoration: line-through">12</span>Complet</span>
    </div>
  </div>

  <sc-if value="{{cap}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 14px; right: 14px; bottom: 62px; background: #15130F; color: #FFFFFF; border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 600; line-height: 1.3">Touche le jour que tu veux.</div>
  </sc-if>

  <div style="border-top: 1px solid #E7E2DC; padding: 13px 18px 16px; font-size: 14px; font-weight: 700">Studio</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cap = !!(this.state && this.state.cap);
    const full = [5, 12];
    const few = [6, 13, 19, 20, 24, 26, 31];
    const names = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
    const days = [];
    for (let n = 1; n <= 31; n++) {
      const isFull = full.indexOf(n) >= 0;
      const wd = names[(n + 1) % 7];
      days.push({
        n: n,
        free: !isFull,
        full: isFull,
        dot: few.indexOf(n) >= 0 ? "block" : "none",
        label: wd + " " + (n === 1 ? "1er" : n) + " décembre" + (isFull ? ", complet" : "")
      });
    }
    return {
      cap,
      days,
      say: () => {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance("Touche le jour que tu veux.");
          u.lang = "fr-FR";
          window.speechSynthesis.speak(u);
        } catch (e) {}
        this.setState({ cap: !cap });
      }
    };
  }
}
</script>
</body>
</html>
