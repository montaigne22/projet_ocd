<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Envoyer le lien de son live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#15130F;text-decoration:none}a:hover{color:#15130F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #15130F; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; line-height: 1.4; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px">
    <a href="Pass.dc.html" aria-label="Retour" style="width: 46px; height: 46px; border-radius: 50%; background: #F5F2EE; display: grid; place-items: center; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 19px">Je suis en live</span>
    <button onClick="{{say}}" aria-label="Écouter cet écran" style="margin-left: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; background: #FFE7D1; color: #15130F; display: grid; place-items: center; cursor: pointer; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 18px 10px; min-height: 0; overflow-y: auto; scrollbar-width: none">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.04; letter-spacing: -0.025em">Envoie le lien de ton live.</h1>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="g-url" style="font-weight: 700; font-size: 14.5px">Le lien de ton live</label>
      <input id="g-url" value="{{url}}" onChange="{{setUrl}}" autocomplete="off" inputmode="url" style="height: 52px; box-sizing: border-box; border: 2px solid #E7E2DC; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #15130F; background: #FFFFFF; width: 100%">
      <sc-if value="{{linkOk}}" hint-placeholder-val="{{true}}">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #0A5A31"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px"><path d="M20 6L9 17l-5-5"></path></svg>Lien TikTok reconnu</span>
      </sc-if>
      <sc-if value="{{linkBad}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 14px; font-weight: 700; color: #B01522; line-height: 1.3">Ce n'est pas un lien de live. Copie-le depuis « Partager » dans TikTok.</span>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="g-name" style="font-weight: 700; font-size: 14.5px">Ton nom ou ta boutique</label>
      <input id="g-name" value="{{name}}" onChange="{{setName}}" autocomplete="off" style="height: 52px; box-sizing: border-box; border: 2px solid #E7E2DC; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 17px; color: #15130F; background: #FFFFFF; width: 100%">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="l-gcc" style="font-weight: 700; font-size: 14.5px">Ton pays</span>
      <div role="group" aria-labelledby="l-gcc" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px">
        <button aria-pressed="true" style="flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; box-sizing: border-box; border: 2px solid #15130F; border-radius: 999px; padding: 8px 13px; background: #15130F; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14.5px"><span aria-hidden="true" style="width: 24px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,0.4); background: linear-gradient(#D21034,#D21034) 0 0/38% 60% no-repeat, repeating-linear-gradient(180deg,#006A4E 0 20%,#FFCE00 20% 40%)"></span>Togo</button>
        <button aria-pressed="false" style="flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; box-sizing: border-box; border: 2px solid #E7E2DC; border-radius: 999px; padding: 8px 13px; background: #FFFFFF; color: #15130F; font-family: inherit; font-weight: 600; font-size: 14.5px"><span aria-hidden="true" style="width: 24px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,0.14); background: linear-gradient(#008751,#008751) 0 0/40% 100% no-repeat, linear-gradient(180deg,#FCD116 50%,#E8112D 50%)"></span>Bénin</button>
        <button aria-pressed="false" style="flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; box-sizing: border-box; border: 2px solid #E7E2DC; border-radius: 999px; padding: 8px 13px; background: #FFFFFF; color: #15130F; font-family: inherit; font-weight: 600; font-size: 14.5px"><span aria-hidden="true" style="width: 24px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,0.14); background: linear-gradient(90deg,#007A5E 33.33%,#CE1126 33.33% 66.66%,#FCD116 66.66%)"></span>Cameroun</button>
        <button aria-pressed="false" style="flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; box-sizing: border-box; border: 2px solid #E7E2DC; border-radius: 999px; padding: 8px 13px; background: #FFFFFF; color: #15130F; font-family: inherit; font-weight: 600; font-size: 14.5px"><span aria-hidden="true" style="width: 24px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,0.14); background: linear-gradient(90deg,#F77F00 33.33%,#FFFFFF 33.33% 66.66%,#009E60 66.66%)"></span>Côte d'Ivoire</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="l-gcat" style="font-weight: 700; font-size: 14.5px">Tu vends quoi ?</span>
      <div role="group" aria-labelledby="l-gcat" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px">
        <button onClick="{{pickFood}}" aria-pressed="{{isFood}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 74px; box-sizing: border-box; border-radius: 15px; padding: 9px 4px 7px; font-family: inherit; font-weight: 600; font-size: 13.5px; color: #15130F; cursor: pointer; border: 2px solid {{bdFood}}; background: {{bgFood}}"><svg viewBox="0 0 48 48" aria-hidden="true" style="width: 36px; height: 36px"><path d="M6 24h36a18 18 0 0 1-36 0z" fill="#15130F"></path><rect x="17" y="40" width="14" height="3.5" rx="1.75" fill="#15130F"></rect><path d="M17 18c-2.5-3 2.5-5 0-8.5M24 18c-2.5-3 2.5-5 0-8.5M31 18c-2.5-3 2.5-5 0-8.5" fill="none" stroke="#F46A00" stroke-width="3.2" stroke-linecap="round"></path></svg>Nourriture</button>
        <button onClick="{{pickMode}}" aria-pressed="{{isMode}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 74px; box-sizing: border-box; border-radius: 15px; padding: 9px 4px 7px; font-family: inherit; font-weight: 600; font-size: 13.5px; color: #15130F; cursor: pointer; border: 2px solid {{bdMode}}; background: {{bgMode}}"><svg viewBox="0 0 48 48" aria-hidden="true" style="width: 36px; height: 36px"><path d="M17 7L6 13l4.5 8 4.5-2.5V41h18V18.5l4.5 2.5 4.5-8-11-6c-1.5 4-10.5 4-12 0z" fill="#15130F"></path><rect x="25.5" y="20" width="5" height="5" rx="1" fill="#F46A00"></rect></svg>Habits</button>
        <button onClick="{{pickBeauty}}" aria-pressed="{{isBeauty}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 74px; box-sizing: border-box; border-radius: 15px; padding: 9px 4px 7px; font-family: inherit; font-weight: 600; font-size: 13.5px; color: #15130F; cursor: pointer; border: 2px solid {{bdBeauty}}; background: {{bgBeauty}}"><svg viewBox="0 0 48 48" aria-hidden="true" style="width: 36px; height: 36px"><rect x="16" y="25" width="14" height="17" rx="2" fill="#15130F"></rect><rect x="18" y="19.5" width="10" height="4" rx="1" fill="#15130F"></rect><path d="M19 18v-8l8-4v12z" fill="#F46A00"></path><path d="M38 8l1.3 3.2 3.2 1.3-3.2 1.3L38 17l-1.3-3.2-3.2-1.3 3.2-1.3z" fill="#F46A00"></path></svg>Beauté</button>
        <button onClick="{{pickTech}}" aria-pressed="{{isTech}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 74px; box-sizing: border-box; border-radius: 15px; padding: 9px 4px 7px; font-family: inherit; font-weight: 600; font-size: 13.5px; color: #15130F; cursor: pointer; border: 2px solid {{bdTech}}; background: {{bgTech}}"><svg viewBox="0 0 48 48" aria-hidden="true" style="width: 36px; height: 36px"><rect x="13" y="5" width="22" height="38" rx="5" fill="#15130F"></rect><path d="M26 12l-8 13h6l-2 11 8-13h-6z" fill="#F46A00"></path></svg>Téléphones</button>
        <button onClick="{{pickHome}}" aria-pressed="{{isHome}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 74px; box-sizing: border-box; border-radius: 15px; padding: 9px 4px 7px; font-family: inherit; font-weight: 600; font-size: 13.5px; color: #15130F; cursor: pointer; border: 2px solid {{bdHome}}; background: {{bgHome}}"><svg viewBox="0 0 48 48" aria-hidden="true" style="width: 36px; height: 36px"><path d="M6 22L24 7l18 15v19H6z" fill="#15130F"></path><rect x="20" y="28" width="8" height="13" rx="1" fill="#F46A00"></rect></svg>Maison</button>
        <button onClick="{{pickOther}}" aria-pressed="{{isOther}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 74px; box-sizing: border-box; border-radius: 15px; padding: 9px 4px 7px; font-family: inherit; font-weight: 600; font-size: 13.5px; color: #15130F; cursor: pointer; border: 2px solid {{bdOther}}; background: {{bgOther}}"><svg viewBox="0 0 48 48" aria-hidden="true" style="width: 36px; height: 36px"><rect x="8" y="8" width="13" height="13" rx="3" fill="#15130F"></rect><rect x="27" y="8" width="13" height="13" rx="3" fill="#15130F"></rect><rect x="8" y="27" width="13" height="13" rx="3" fill="#15130F"></rect><circle cx="33.5" cy="33.5" r="6.5" fill="#F46A00"></circle></svg>Autre</button>
      </div>
    </div>
  </div>

  <sc-if value="{{cap}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 14px; right: 14px; bottom: 96px; background: #15130F; color: #FFFFFF; border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 600; line-height: 1.3; box-shadow: 0 0 0 2px #FFFFFF">Colle le lien de ton live, choisis ton pays et ce que tu vends, puis envoie.</div>
  </sc-if>

  <div style="border-top: 1px solid #E7E2DC; padding: 10px 14px 14px">
    <sc-if value="{{errSend}}" hint-placeholder-val="{{false}}">
      <span role="alert" style="display: block; margin-bottom: 8px; font-size: 13.5px; font-weight: 700; color: #B01522">Il faut le lien de ton live et ton nom.</span>
    </sc-if>
    <sc-if value="{{valid}}" hint-placeholder-val="{{true}}">
      <a href="EnLigne.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 17px; background: #F46A00; color: #15130F; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 18.5px">Envoyer mon live</a>
    </sc-if>
    <sc-if value="{{invalid}}" hint-placeholder-val="{{false}}">
      <button onClick="{{showErr}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; border: 0; border-radius: 17px; background: #F46A00; color: #15130F; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 18.5px; cursor: pointer">Envoyer mon live</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const cap = !!s.cap;
    const cat = s.cat || "food";
    const url = s.url === undefined ? "https://www.tiktok.com/@exemple.awa/live" : s.url;
    const name = s.name === undefined ? "Awa Mensah" : s.name;
    const ok = /^(https?:\/\/)?([a-z0-9.-]+\.)?tiktok\.com\/\S+/i.test(url.trim());
    const on = (k) => (cat === k ? "#F46A00" : "#E7E2DC");
    const bg = (k) => (cat === k ? "#FFE7D1" : "#FFFFFF");
    return {
      cap, url, name,
      linkOk: ok,
      valid: ok && name.trim().length >= 2,
      invalid: !(ok && name.trim().length >= 2),
      errSend: !!s.err && !(ok && name.trim().length >= 2),
      showErr: () => this.setState({ err: true }),
      linkBad: !ok && url.trim().length > 0,
      setUrl: (e) => this.setState({ url: e.target.value }),
      setName: (e) => this.setState({ name: e.target.value }),
      pickFood: () => this.setState({ cat: "food" }), isFood: cat === "food", bdFood: on("food"), bgFood: bg("food"),
      pickMode: () => this.setState({ cat: "mode" }), isMode: cat === "mode", bdMode: on("mode"), bgMode: bg("mode"),
      pickBeauty: () => this.setState({ cat: "beauty" }), isBeauty: cat === "beauty", bdBeauty: on("beauty"), bgBeauty: bg("beauty"),
      pickTech: () => this.setState({ cat: "tech" }), isTech: cat === "tech", bdTech: on("tech"), bgTech: bg("tech"),
      pickHome: () => this.setState({ cat: "home" }), isHome: cat === "home", bdHome: on("home"), bgHome: bg("home"),
      pickOther: () => this.setState({ cat: "other" }), isOther: cat === "other", bdOther: on("other"), bgOther: bg("other"),
      say: () => {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance("Colle le lien de ton live, choisis ton pays et ce que tu vends, puis envoie.");
          u.lang = "fr-FR";
          window.speechSynthesis.speak(u);
        } catch (e) {}
        this.setState({ cap: !cap });
      }
    };
  }
}
</script>
</body>
</html>
