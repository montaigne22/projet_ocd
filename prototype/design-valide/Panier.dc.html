<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#15130F;text-decoration:none}a:hover{color:#15130F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #15130F; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; line-height: 1.4; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px">
    <a href="Shop.dc.html" aria-label="Retour au shop" style="width: 46px; height: 46px; border-radius: 50%; background: #F5F2EE; display: grid; place-items: center; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Mon panier</h1>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 12px; padding: 8px 18px 12px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
      <div style="display: grid; grid-template-columns: 84px 1fr; gap: 12px; border: 2px solid #E7E2DC; border-radius: 18px; padding: 10px">
        <span style="height: 96px; border-radius: 12px; background: #F5F2EE; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #665F58">Photo</span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-weight: 700; font-size: 15.5px; line-height: 1.2">{{l.name}}</span>
          <span style="font-size: 13px; color: #665F58">{{l.variant}}</span>
          <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 16.5px; font-variant-numeric: tabular-nums">{{l.price}}</span>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto">
            <div style="display: flex; align-items: center; gap: 3px; background: #F5F2EE; border-radius: 12px; padding: 3px">
              <button onClick="{{l.less}}" aria-label="{{l.ariaLess}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #15130F; font-family: inherit; font-size: 21px; font-weight: 700; cursor: pointer">−</button>
              <span aria-live="polite" style="min-width: 30px; text-align: center; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums">{{l.qty}}</span>
              <button onClick="{{l.more}}" aria-label="{{l.ariaMore}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #15130F; font-family: inherit; font-size: 21px; font-weight: 700; cursor: pointer">+</button>
            </div>
            <button onClick="{{l.remove}}" style="min-height: 44px; border: 0; background: #FFFFFF; color: #15130F; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer">Retirer</button>
          </div>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 10px; text-align: center">
        <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1">Ton panier est vide.</span>
        <a href="Shop.dc.html" style="display: flex; align-items: center; min-height: 52px; border-radius: 15px; padding: 0 20px; background: #15130F; color: #FFFFFF; font-weight: 700; font-size: 16px">Voir le shop</a>
      </div>
    </sc-if>

    <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px; background: #F5F2EE; border-radius: 16px; padding: 14px 16px; margin-top: auto">
        <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px"><span>{{countLine}}</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{subtotal}}</span></div>
        <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px"><span>Livraison</span><span style="color: #665F58">selon ton quartier</span></div>
        <div style="display: flex; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 600; border-top: 1px solid #DDD7D0; padding-top: 10px"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; flex: none"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M11 18h2"></path></svg>Mobile Money, carte, ou paiement à la livraison.</div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
    <div style="border-top: 1px solid #E7E2DC; padding: 10px 14px 14px">
      <a href="Livraison.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 17px; background: #F46A00; color: #15130F; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 18.5px">Commander · {{subtotal}}</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const qty = Object.assign({ a: 1, b: 2 }, s.qty || {});
    const fr = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F";
    const defs = [
      ["a", "Robe en wax", "Bleu · taille M", 12000, 3],
      ["b", "Beurre de karité 250 g", "Taille unique", 2500, 40]
    ];
    const set = (id, n) => { const next = Object.assign({}, qty); next[id] = n; this.setState({ qty: next }); };
    let count = 0;
    let total = 0;
    const lines = defs.filter((d) => qty[d[0]] > 0).map((d) => {
      const n = qty[d[0]];
      count += n;
      total += n * d[3];
      return {
        name: d[1],
        variant: d[2],
        price: fr(d[3] * n),
        qty: n,
        ariaLess: "Retirer un : " + d[1],
        ariaMore: "Ajouter un : " + d[1],
        less: () => set(d[0], Math.max(1, n - 1)),
        more: () => set(d[0], Math.min(d[4], n + 1)),
        remove: () => set(d[0], 0)
      };
    });
    return {
      lines,
      empty: lines.length === 0,
      hasItems: lines.length > 0,
      countLine: count + (count > 1 ? " articles" : " article"),
      subtotal: fr(total)
    };
  }
}
</script>
</body>
</html>
