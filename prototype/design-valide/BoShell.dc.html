<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En-tête du back-office</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 144px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #15130F; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.4">
  <div style="display: flex; align-items: center; gap: 4px; height: 48px; flex: none; box-sizing: border-box; padding: 0 14px; background: #15130F; color: #FFFFFF">
    <span aria-hidden="true" style="width: 34px; height: 34px; display: grid; place-items: center; color: #C9C3BC"><svg viewBox="0 0 24 24" fill="currentColor" style="width: 18px; height: 18px"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"></path></svg></span>
    <img src="/_blob/273c64c79958def7341794eb4577315c" alt="" style="width: 28px; height: 28px; border-radius: 50%">
    <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 16.5px; margin: 0 14px 0 6px; white-space: nowrap">OCD Live</span>
    <nav aria-label="Menus du back-office" style="display: flex; align-self: stretch">
      <sc-for list="{{menus}}" as="m" hint-placeholder-count="8">
        <a href="{{m.href}}" aria-current="{{m.current}}" style="display: flex; align-items: center; box-sizing: border-box; padding: 0 10px; font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none; color: {{m.fg}}; border-top: 3px solid transparent; border-bottom: 3px solid {{m.line}}">{{m.label}}</a>
      </sc-for>
    </nav>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 14px">
      <a href="BoWhatsApp.dc.html" aria-label="WhatsApp : 4 conversations en attente" style="position: relative; width: 34px; height: 34px; display: grid; place-items: center; color: #FFFFFF; text-decoration: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg><span style="position: absolute; top: -2px; right: -6px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #C4162A; color: #FFFFFF; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center">4</span></a>
      <a href="BoDashboard.dc.html" aria-label="Activités : 7 à traiter" style="position: relative; width: 34px; height: 34px; display: grid; place-items: center; color: #FFFFFF; text-decoration: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 7v5l3 2"></path></svg><span style="position: absolute; top: -2px; right: -6px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #C4162A; color: #FFFFFF; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center">7</span></a>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #F46A00; color: #15130F; display: grid; place-items: center; font-weight: 800; font-size: 12px">RG</span>Régie OCD</span>
    </span>
  </div>

  <div style="display: flex; align-items: stretch; gap: 2px; height: 40px; flex: none; box-sizing: border-box; padding: 0 22px; background: #FFFFFF; border-bottom: 1px solid #E3E6E9">
    <sc-for list="{{subs}}" as="s" hint-placeholder-count="3">
      <a href="{{s.href}}" aria-current="{{s.current}}" style="display: flex; align-items: center; box-sizing: border-box; padding: 0 12px; font-size: 13.5px; white-space: nowrap; text-decoration: none; font-weight: {{s.weight}}; color: {{s.fg}}; border-top: 2px solid transparent; border-bottom: 2px solid {{s.line}}">{{s.label}}</a>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 56px; flex: none; box-sizing: border-box; padding: 0 22px; background: #FFFFFF; border-bottom: 1px solid #D3D7DB">
    <sc-if value="{{hasAction}}" hint-placeholder-val="{{true}}">
      <span style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 8px; background: #F46A00; color: #15130F; font-weight: 700; font-size: 14px; white-space: nowrap">{{action}}</span>
    </sc-if>
    <div style="display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap">
      <sc-if value="{{hasCrumb}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 15px; color: #5A6068">{{crumb}}</span>
        <span aria-hidden="true" style="font-size: 15px; color: #8A9097">/</span>
      </sc-if>
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 19px">{{title}}</span>
    </div>
    <sc-if value="{{hasSearch}}" hint-placeholder-val="{{true}}">
      <div style="margin-left: auto; display: flex; align-items: center; gap: 6px; width: 440px; min-height: 36px; box-sizing: border-box; border: 1px solid #AEB4BA; border-radius: 8px; padding: 3px 6px 3px 10px; background: #FFFFFF">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5A6068" stroke-width="2.2" stroke-linecap="round" style="width: 16px; height: 16px; flex: none"><path d="M10.5 18a7.5 7.5 0 1 0 0-15a7.5 7.5 0 1 0 0 15zM16 16l5 5"></path></svg>
        <sc-for list="{{facets}}" as="f" hint-placeholder-count="2">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; background: #F4F5F6; border: 1px solid #D3D7DB; font-size: 13px; font-weight: 600; white-space: nowrap">{{f.label}}<span aria-hidden="true" style="color: #5A6068">×</span></span>
        </sc-for>
        <span style="flex: 1; min-width: 0; font-size: 13.5px; color: #6B7178; white-space: nowrap; overflow: hidden">Rechercher…</span>
        <span style="display: flex; align-items: center; gap: 4px; border-left: 1px solid #D3D7DB; padding-left: 8px; font-size: 13px; font-weight: 700; color: #3F454C; white-space: nowrap">Filtres<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px"><path d="M6 9l6 6 6-6"></path></svg></span>
      </div>
    </sc-if>
    <span style="margin-left: {{pagerMargin}}; font-size: 13px; color: #5A6068; white-space: nowrap; font-variant-numeric: tabular-nums">{{pager}}</span>
    <sc-if value="{{hasViews}}" hint-placeholder-val="{{true}}">
      <div aria-hidden="true" style="display: flex; flex: none; border: 1px solid #AEB4BA; border-radius: 8px; overflow: hidden">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="6">
          <span style="width: 34px; height: 32px; display: grid; place-items: center; background: {{v.bg}}; color: {{v.fg}}; border-left: 1px solid {{v.sep}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px"><path d="{{v.d}}"></path></svg></span>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menu":{"editor":"enum","options":["dashboard","lives","shop","livraisons","vendeurs","whatsapp","recrutement","config"],"default":"livraisons"},"sub":{"editor":"text","default":"dispatch"},"title":{"editor":"text","default":"Dispatch"},"crumb":{"editor":"text","default":""},"facets":{"editor":"text","default":"Aujourd&#39;hui|Douala"},"views":{"editor":"text","default":"kanban,list,calendar,pivot,graph,activity"},"view":{"editor":"text","default":"kanban"},"pager":{"editor":"text","default":"1-10 / 10"},"action":{"editor":"text","default":"Nouveau"},"search":{"editor":"enum","options":["oui","non"],"default":"oui"},"$preview":{"width":1280,"height":144}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const menu = p.menu ?? "livraisons";
    const sub = p.sub ?? "dispatch";
    const view = p.view ?? "kanban";
    const action = String(p.action ?? "Nouveau").trim();
    const crumb = String(p.crumb ?? "").trim();
    const hasSearch = (p.search ?? "oui") === "oui";
    const viewKeys = String(p.views ?? "kanban,list,calendar,pivot,graph,activity").split(",").map((v) => v.trim()).filter(Boolean);
    const facetList = String(p.facets ?? "").split("|").map((f) => f.trim()).filter(Boolean);
    const menus = [
      ["dashboard", "Tableau de bord", "BoDashboard.dc.html"],
      ["lives", "Lives", "BoReservations.dc.html"],
      ["shop", "Shop", "BoCommandes.dc.html"],
      ["livraisons", "Livraisons", "BoDispatch.dc.html"],
      ["vendeurs", "Vendeurs", "BoVendeur.dc.html"],
      ["whatsapp", "WhatsApp", "BoWhatsApp.dc.html"],
      ["recrutement", "Recrutement", "BoRecrutement.dc.html"],
      ["config", "Configuration", "BoParametres.dc.html"]
    ];
    const subsBy = {
      dashboard: [["dash", "Vue d'ensemble", "BoDashboard.dc.html"]],
      lives: [["resa", "Réservations", "BoReservations.dc.html"], ["regie", "Régie en direct", "Regie.dc.html"], ["verif", "À vérifier", "BoVerification.dc.html"]],
      shop: [["cmd", "Commandes", "BoCommandes.dc.html"], ["verif", "Produits à vérifier", "BoVerification.dc.html"]],
      livraisons: [["dispatch", "Dispatch", "BoDispatch.dc.html"], ["fiche", "Livraisons", "BoLivraison.dc.html"], ["livreurs", "Livreurs et caisse", "BoLivreurs.dc.html"]],
      vendeurs: [["vendeurs", "Vendeurs", "BoVendeur.dc.html"], ["reversements", "Reversements", "BoReversements.dc.html"]],
      whatsapp: [["conv", "Conversations", "BoWhatsApp.dc.html"], ["auto", "Messages automatiques", "BoAutomatisations.dc.html"]],
      recrutement: [["animatrice", "Animatrice live · Lomé", "BoRecrutement.dc.html"]],
      config: [["params", "Paramètres", "BoParametres.dc.html"], ["auto", "Automatisations", "BoAutomatisations.dc.html"], ["outils", "Outils Odoo utilisés", "BoOutils.dc.html"]]
    };
    const icons = {
      kanban: "M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v7h-4z",
      list: "M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1",
      calendar: "M4 5h16v15H4zM4 10h16M9 3v4M15 3v4",
      pivot: "M4 4h16v16H4zM4 10h16M10 4v16",
      graph: "M5 20V11M11 20V5M17 20v-8M3 20h18",
      activity: "M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 7v5l3 2",
      form: "M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"
    };
    return {
      menus: menus.map((m) => ({
        label: m[1],
        href: m[2],
        current: m[0] === menu ? "page" : "false",
        fg: m[0] === menu ? "#FFFFFF" : "#C9C3BC",
        line: m[0] === menu ? "#F46A00" : "transparent"
      })),
      subs: (subsBy[menu] || []).map((x) => ({
        label: x[1],
        href: x[2],
        current: x[0] === sub ? "page" : "false",
        fg: x[0] === sub ? "#15130F" : "#5A6068",
        weight: x[0] === sub ? "700" : "600",
        line: x[0] === sub ? "#F46A00" : "transparent"
      })),
      views: viewKeys.filter((k) => icons[k]).map((k, i) => ({
        d: icons[k],
        bg: k === view ? "#15130F" : "#FFFFFF",
        fg: k === view ? "#FFFFFF" : "#3F454C",
        sep: i === 0 ? "transparent" : "#AEB4BA"
      })),
      facets: facetList.map((f) => ({ label: f })),
      hasViews: viewKeys.length > 0,
      hasSearch: hasSearch,
      hasAction: action.length > 0,
      action: action,
      hasCrumb: crumb.length > 0,
      crumb: crumb,
      title: p.title ?? "Dispatch",
      pager: p.pager ?? "",
      pagerMargin: hasSearch ? "0" : "auto"
    };
  }
}
</script>
</body>
</html>
