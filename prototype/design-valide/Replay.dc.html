<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Revoir un live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#15130F;text-decoration:none}a:hover{color:#15130F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #15130F; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; line-height: 1.4; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px">
    <a href="Vitrine.dc.html" aria-label="Retour à la boutique" style="width: 46px; height: 46px; border-radius: 50%; background: #F5F2EE; display: grid; place-items: center; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 19px">Revoir le live</span>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 12px; padding: 6px 18px 14px">
    <div style="position: relative; height: 270px; flex: none; border-radius: 20px; background: #15130F; color: #FFFFFF; overflow: hidden">
      <span style="position: absolute; left: 12px; top: 12px; background: #FFFFFF; color: #15130F; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700">Replay</span>
      <span style="position: absolute; right: 12px; top: 12px; font-size: 12.5px; font-weight: 600; color: #D9D3CC">Vidéo publiée sur TikTok</span>
      <button onClick="{{play}}" aria-label="{{playLabel}}" style="position: absolute; left: 50%; top: 42%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 0; border-radius: 50%; background: #F46A00; color: #15130F; display: grid; place-items: center; cursor: pointer">
        <sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" style="width: 26px; height: 26px; margin-left: 3px"><path d="M6 3l14 9-14 9z"></path></svg></sc-if>
        <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" style="width: 24px; height: 24px"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></sc-if>
      </button>
      <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; background: rgba(21,19,15,0.86); border-radius: 12px; padding: 7px 10px">
          <span style="background: #F46A00; color: #15130F; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 12px; line-height: 1; padding: 7px 6px; border-radius: 7px">OCD</span>
          <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 700; font-size: 13.5px; line-height: 1.25">Brenda Wax · Habits · Douala</span><span style="font-size: 12px; line-height: 1.3; color: #FF9A4D">Sa boutique sur OCD Live : brenda-wax</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">
          <span>{{now}}</span>
          <span style="flex: 1; height: 4px; border-radius: 2px; background: #4A453F; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #F46A00; width: {{progress}}"></span></span>
          <span>1:28:00</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 25px; line-height: 1.1; letter-spacing: -0.02em">Live de Brenda Wax</h1>
      <span style="font-size: 14px; color: #665F58">Mar. 1er déc. · 1 h 28 · à distance, avec l'animatrice OCD</span>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.1">Produits montrés</h2>
      <span style="font-size: 13.5px; color: #665F58">Touche pour aller au moment</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border-radius: 15px; padding: 6px 8px 6px 6px; border: 2px solid {{r.bd}}; background: {{r.bg}}">
          <button onClick="{{r.pick}}" aria-pressed="{{r.on}}" aria-label="{{r.aria}}" style="display: grid; grid-template-columns: 58px 44px 1fr; gap: 10px; align-items: center; min-height: 52px; border: 0; padding: 0; background: transparent; color: #15130F; font-family: inherit; text-align: left; cursor: pointer">
            <span style="display: grid; place-items: center; height: 32px; border-radius: 8px; background: #15130F; color: #FFFFFF; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.time}}</span>
            <span style="width: 44px; height: 44px; border-radius: 10px; background: #F5F2EE; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #665F58">Photo</span>
            <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 700; font-size: 14.5px; line-height: 1.2">{{r.name}}</span><span style="font-size: 13.5px; font-variant-numeric: tabular-nums">{{r.price}}</span></span>
          </button>
          <a href="Produit.dc.html" aria-label="{{r.ariaSee}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 6px; font-size: 14px; font-weight: 700; text-decoration: underline">Voir</a>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="border-top: 1px solid #E7E2DC; padding: 10px 14px 14px">
    <sc-if value="{{isDirect}}" hint-placeholder-val="{{false}}">
    <button style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-radius: 17px; background: #F46A00; color: #15130F; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 17px; cursor: pointer"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 21px; height: 21px"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>Écrire à Brenda pour « {{nowName}} »</button>
    </sc-if>
    <sc-if value="{{isOcd}}" hint-placeholder-val="{{true}}">
      <a href="Produit.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 17px; background: #F46A00; color: #15130F; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 17px">Commander « {{nowName}} »</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modeVente":{"editor":"enum","options":["Vendu par OCD","Contact direct"],"default":"Vendu par OCD"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const ocd = (this.props.modeVente ?? "Vendu par OCD") === "Vendu par OCD";
    const cur = s.cur === undefined ? 0 : s.cur;
    const playing = !!s.playing;
    const fr = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F";
    const chapters = [
      ["02:10", "Robe en wax", 12000, 2],
      ["09:35", "Pagne wax 6 yards", 9000, 11],
      ["21:50", "Chemise wax homme", 10000, 25],
      ["34:05", "Foulard wax", 3500, 39],
      ["48:20", "Jupe en wax", 8000, 55]
    ];
    const rows = chapters.map((c, i) => ({
      time: c[0],
      name: c[1],
      price: fr(c[2]),
      on: i === cur,
      bd: i === cur ? "#F46A00" : "#E7E2DC",
      bg: i === cur ? "#FFE7D1" : "#FFFFFF",
      aria: "Aller à " + c[0] + " : " + c[1],
      ariaSee: "Voir le produit : " + c[1],
      pick: () => this.setState({ cur: i, playing: true })
    }));
    return {
      rows,
      isOcd: ocd,
      isDirect: !ocd,
      playing,
      paused: !playing,
      playLabel: playing ? "Mettre en pause" : "Lire le replay",
      now: chapters[cur][0],
      nowName: chapters[cur][1],
      progress: chapters[cur][3] + "%",
      play: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
