# OCD: TURN relay of the agents (coturn), in Docker. The secret, the realm (name of the server) and
# the public IP are given by docker-compose.yml from .env.
listening-port=3478
# the TLS port comes from TURN_TLS_PORT of .env (443, or 5349 when nginx holds 443)
cert=/run/ocd-certs/fullchain.pem
pkey=/run/ocd-certs/privkey.pem
use-auth-secret

# relay ports, apart from those of FreeSWITCH (16384-32768)
min-port=49152
max-port=65535

fingerprint
# (coturn 4.18: no console unless asked, no TLS 1.0 and 1.1)
no-multicast-peers
# never a relay towards the private networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
total-quota=200
user-quota=12
log-file=stdout
simple-log
