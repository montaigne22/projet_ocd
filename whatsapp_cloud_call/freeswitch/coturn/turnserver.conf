# OCD: TURN relay of the agents (coturn), /etc/turnserver.conf
# The voice of an agent goes through it when their network blocks the voice (UDP): over TCP or
# TLS on the port 443. Odoo gives each agent credentials of 12 hours (REST API of coturn).

listening-port=3478
tls-listening-port=443
# the same name and certificate as FreeSWITCH
realm=calls.example.com
# copied at each renewal by ocd-freeswitch-certs.sh
cert=/etc/coturn/ocd-fullchain.pem
pkey=/etc/coturn/ocd-privkey.pem

# same value as Settings > WhatsApp > Calls > Secret of the TURN Relay, in Odoo
use-auth-secret
static-auth-secret=CHANGE-ME

# relay ports, apart from those of FreeSWITCH (16384-32768)
min-port=49152
max-port=65535

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# never a relay towards the private networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
total-quota=200
user-quota=12
log-file=syslog
simple-log
